version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # No requirements.txt yet — this starts auditing/updating Python
  # dependencies automatically the moment one is added for a backend.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
